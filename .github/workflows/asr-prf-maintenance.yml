name: ASR and PRF maintenance

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: asr-prf-maintenance-main
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run maintenance script
        run: python scripts/asr_prf_maintenance.py

      - name: Commit maintenance changes to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No maintenance changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Auto-maintain ASR and PRF files"
          git push origin HEAD:main
